name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://heoquaybinhtan.com
          NEXTAUTH_URL: https://heoquaybinhtan.com
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Remove cache before upload
        run: rm -rf .next/cache

      - name: Backup image cache on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /tmp/next-image-cache
            cp -r /home/heoquaybinhtan/app/.next/cache/images/. /tmp/next-image-cache/ 2>/dev/null || true

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: ".next,public,package.json,package-lock.json,prisma,next.config.mjs,ecosystem.config.js,start.sh"
          target: "~/app"

      - name: Restore image cache, restart pm2, warm cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /home/heoquaybinhtan/app/.next/cache/images
            cp -r /tmp/next-image-cache/. /home/heoquaybinhtan/app/.next/cache/images/ 2>/dev/null || true
            cd /home/heoquaybinhtan/app
            npm install --legacy-peer-deps
            chmod +x start.sh
            chmod 644 ecosystem.config.js
            if pm2 describe heoquaybinhtan > /dev/null 2>&1; then
              pm2 restart heoquaybinhtan --update-env
            else
              fuser -k 3000/tcp 2>/dev/null || true
              sleep 2
              pm2 start /home/heoquaybinhtan/app/ecosystem.config.js --update-env
            fi
            pm2 save
            sleep 20
            curl -sf https://heoquaybinhtan.com/ -o /dev/null && echo "Cache warmed"
